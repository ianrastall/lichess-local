[package]
name = "merci-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
build = "build.rs"

[lib]
name = "merci_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "merci-cli"
path = "src/main.rs"

[dependencies]
shakmaty = { version = "=0.30.2", features = ["variant"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "unwind"
